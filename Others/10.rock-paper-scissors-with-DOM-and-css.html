<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>

        <style>
            body{
                background-color: black;
                color: white;
                font-family: Arial;
            }
            .heading{
                display: flex;
                justify-content: center;
                font-size: 35px;
                font-weight: bold;
            }
            .move-icon{
                height: 70px;
                pointer-events: none;  /*important step, this step is the reason why .move-button:active works*/
            }
            .moves,.result-display{
                display: flex;
                justify-content: center;
            }
            .verdicts{
                display: grid;
                grid-template-rows: auto;
                justify-content: center;
                text-align: center;
                margin-top: 30px;
                font-size: 20px;
                font-weight: bold;
                margin-left: -40px;
            }
            .icon-grid{
                display: grid;
                grid-template-columns: 130px 130px 130px;
                column-gap: 150px;
                margin-left: -80px;
            }
            .moves{
                padding-top: 50px;
            }.move-button{
                background-color: transparent;
                border: 3px solid white;
                width: 200px;
                height: 200px;
                border-radius: 150px;
                cursor: pointer;
            }
            .move-button:hover{
                background-color: rgb(58, 58, 58);
            }
            .move-button:active{
                background-color: white;
                transform: scale(0.95);
            }
            .reset-button{
                padding: 15px;
                font-family: Arial;
                font-weight: bold;
                font-size: 25px;
                border-radius:15px;
                cursor: pointer;
                background-color: rgb(254, 0, 0);
                color: white;
                border: none;
                margin-left: -40px;
            }
            .reset-button:active{
                background-color: white;
                color: red;
                transform: scale(0.95);
            }


           
        </style>

    </head>

    <body>
        <p class="heading">Rock Paper Scissors</p>

        <div class="moves">
            <div class="icon-grid">
                <button class="move-button" onclick="playGame('Rock')">
                    <img src="rock-emoji.png" class="move-icon">
                </button>

                <button class="move-button" onclick="playGame('Paper')">
                    <img src="paper-emoji.png" class="move-icon">
                </button>

                <button class="move-button" onclick="playGame('Scissors')">
                    <img src="scissors-emoji.png" class="move-icon">
                </button>
            </div>
            
        </div>

        <br><br>
        
        <div class="verdicts">
            <p class="js-moves"></p>
            <p class="js-result"></p>
            <p class="js-score"></p> 
        </div>

        
        
        
        <div class="result-display">
            <button class="reset-button" onclick="
                        score.wins = 0;
                        score.losses = 0;
                        score.ties = 0;

                        localStorage.setItem('score', JSON.stringify(score)); // ✅ FIX

                        document.querySelector('.js-result').innerHTML = '';
                        document.querySelector('.js-moves').innerHTML = '';
                        document.querySelector('.js-score').innerHTML = 
                        `WINS : 0 Losses : 0 Ties : 0`;
                    
                
                //alert(`Score has been reset \nWins : ${score.wins} Losses : ${score.losses}  Ties : ${score.ties}`)">
                    RESET
                </button>
        </div>
        
        

        <script>

            let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties :0
            };

            document.querySelector('.js-score')
                .innerHTML = `WINS : ${score.wins} Losses : ${score.losses} Ties : ${score.ties}`;
            

            function playGame(playerMove){

                const computerMove = pickComputerMove();
                let result = '';

                if(playerMove === 'Rock'){
                    if(computerMove === 'Rock'){
                        result = 'Tie';
                    }
                    else if(computerMove === 'Paper'){
                        result = 'You Lose';
                    }
                    else if(computerMove === 'Scissors'){
                        result = 'You Win';
                    }
                }
                else if(playerMove === 'Paper'){
                    if(computerMove === 'Rock'){
                        result = 'You Win';
                    }
                    else if(computerMove === 'Paper'){
                        result = 'Tie';
                    }
                    else if(computerMove === 'Scissors'){
                        result = 'You Lose';
                    }
                }
                else if(playerMove === 'Scissors'){
                    if(computerMove === 'Rock'){
                        result = 'You Lose';
                    }
                    else if(computerMove === 'Paper'){
                        result = 'You Win';
                    }
                    else if(computerMove === 'Scissors'){
                        result = 'Tie';
                    }
                }
                if(result === 'You Win'){
                    score.wins++;
                }
                else if(result === 'You Lose'){
                    score.losses++;
                }
                else if(result === 'Tie'){
                    score.ties++;
                }
            localStorage.setItem('score',JSON.stringify(score));
            

            //alert(`You picked ${playerMove}, Computer picked ${computerMove} \nResult : ${result}\nWINS : ${score.wins} Losses : ${score.losses} Ties : ${score.ties} `);
                document.querySelector('.js-result')
                    .innerHTML = result;
                document.querySelector('.js-moves')
                    .innerHTML = `You picked <img src="${playerMove}-emoji.png" class="move-icon">, Computer picked <img src="${computerMove}-emoji.png" class="move-icon">`;
                document.querySelector('.js-score')
                    .innerHTML = `WINS : ${score.wins} Losses : ${score.losses} Ties : ${score.ties}`;
            

           }
           
           function pickComputerMove(){

            const random = Math.random();
            let computerMove = '';

            if(random >= 0 && random < 1/3){
                computerMove = 'Rock';
            }
            else if(random >= 1/3 && random < 2/3){
                computerMove = 'Paper';
            }
            else if(random >= 2/3 && random < 1){
                computerMove = 'Scissors';
            }
            return computerMove;
           }

        </script>    
    </body>
</html>
